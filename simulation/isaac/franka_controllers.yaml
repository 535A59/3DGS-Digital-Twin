# ros2_control config for the in-process ControllerManager (isaacsim.ros2.control, Isaac Sim 6.1).
# Names match moveit_resources_panda_moveit_config / mtc_dynamic gripper_moveit_controllers.yaml.
# Only plugins bundled in Isaac 6.1 are used (JTC + joint_state_broadcaster); no GripperActionController.
controller_manager:
  ros__parameters:
    update_rate: 120
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

panda_arm_controller:
  ros__parameters:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true

panda_hand_controller:
  ros__parameters:
    joints: [panda_finger_joint1]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # goal tolerance 0 = not checked: closing on an object never reaches 0.0, must still succeed.
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.0
      panda_finger_joint1: {trajectory: 0.0, goal: 0.0}
