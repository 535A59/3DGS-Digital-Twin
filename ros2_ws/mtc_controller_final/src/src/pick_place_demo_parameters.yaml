pick_place_task_demo:
  # ---- task: K objects, picked & placed one after another in object_names order ----
  object_names:
    type: string_array
    description: "Execution order of the pick&place sub-tasks (one per object)."
    validation:
      not_empty<>: []
  mesh_scale_factor:
    type: double
    default_value: 1.0
    description: "Uniform scale applied to every object/env mesh (old code hard-coded 0.7)."
  task_timeout:
    type: double
    default_value: 180.0
    description: "Planning timeout (s) of each pick&place sub-task."
  objects:
    __map_object_names:
      mesh_path:
        type: string
        description: "Absolute path of the collision mesh, vertices in the object BODY frame (m)."
        validation:
          not_empty<>: []
      pose_topic:
        type: string
        description: "visualization_msgs/Marker with the body pose in world."
        validation:
          not_empty<>: []
      target_topic:
        type: string
        description: "geometry_msgs/PoseStamped with the target BODY pose in world."
        validation:
          not_empty<>: []
      grasp_offset_xyz:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "TCP position relative to the body origin, world axes (m)."
        validation:
          fixed_size<>: [3]
      grasp_yaw:
        type: double
        default_value: 0.0
        description: "TCP yaw about world Z of the top-down grasp (rad); fingers close along TCP y."
      finger_close:
        type: double
        default_value: 0.02
        description: "Per-finger joint target when closed (m)."
      approach_min_dist:
        type: double
        default_value: 0.05
        description: "Approach before grasp (also used for the retreat after place)."
      approach_max_dist:
        type: double
        default_value: 0.15
      lift_min_dist:
        type: double
        default_value: 0.05
        description: "Lift after grasp (also used for the lowering before place)."
      lift_max_dist:
        type: double
        default_value: 0.15
  env_names:
    type: string_array
    default_value: []
    description: "Static collision objects (meshes already in world frame, pose = identity)."
  env_mesh_paths:
    type: string_array
    default_value: []
  motion_scaling:
    type: double
    default_value: 0.3
    description: "Velocity and acceleration scaling of every planned motion (full speed shakes grasped objects loose in sim)."
    validation:
      bounds<>: [0.01, 1.0]
  release_open:
    type: double
    default_value: 0.04
    description: "Per-finger joint target of the release at place (m): Panda max, wider than 'open' (0.035), so an object that leans a few degrees as it settles does not rest on a finger that then drags it over on the retreat."
    validation:
      bounds<>: [0.0, 0.04]
  # ---- robot (config/panda_config.yaml) ----
  max_solutions:
    type: int
    default_value: 10
  arm_group_name:
    type: string
    validation:
      not_empty<>: []
  eef_name:
    type: string
    validation:
      not_empty<>: []
  hand_group_name:
    type: string
    validation:
      not_empty<>: []
  hand_frame:
    type: string
    validation:
      not_empty<>: []
  hand_open_pose:
    type: string
    validation:
      not_empty<>: []
  arm_home_pose:
    type: string
    validation:
      not_empty<>: []
  world_frame:
    type: string
    validation:
      not_empty<>: []
  grasp_frame_transform:
    type: double_array
    description: "MTC ik_frame (TCP) relative to hand_frame [x,y,z,r,p,y]."
    validation:
      fixed_size<>: [6]
